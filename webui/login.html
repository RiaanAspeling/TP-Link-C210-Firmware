<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* Force the login onto TLS before the password can be typed: over http it
   would cross the LAN as base64 (== cleartext). Scoped to the WebUI on purpose —
   ONVIF/RTSP/snapshot stay on http because their clients can't accept the
   self-signed cert (a browser can). The protocol check makes this a one-shot,
   so no redirect loop. Assumes S02ssl produced a cert; in the rare http-only
   fallback there is no :443 to reach and access is via SSH. */
if(location.protocol==='http:')location.replace('https://'+location.host+location.pathname+location.search+location.hash);</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in</title>
<style>
:root{--bg:#16181d;--card:#1e2127;--fg:#e6e8eb;--muted:#8b929c;--line:#2c3038;--accent:#3d7dff;--err:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
     font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px 26px;width:min(92vw,320px)}
h1{margin:0 0 20px;font-size:17px;font-weight:600;letter-spacing:.2px}
label{display:block;margin:0 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
input{width:100%;padding:10px 12px;margin-bottom:16px;background:#15171c;color:var(--fg);
      border:1px solid var(--line);border-radius:6px;font-size:15px}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;padding:11px;background:var(--accent);color:#fff;border:0;border-radius:6px;
       font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#err{min-height:18px;margin:12px 0 0;color:var(--err);font-size:13px;text-align:center}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Camera sign in</h1>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" value="root" required autofocus>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">Sign in</button>
  <p id="err" role="alert"></p>
</form>
<script>
const f=document.getElementById('f'),b=document.getElementById('b'),err=document.getElementById('err');

// login.cgi only base64-decodes when "encoding":"base64" is present. Send it
// encoded regardless of charset: the CGI parses with grep -o '"password":"[^"]*"',
// so a literal quote in the password would otherwise truncate it.
const b64=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));

f.addEventListener('submit',async e=>{
  e.preventDefault();
  err.textContent='';b.disabled=true;b.textContent='Signing in…';
  try{
    const r=await fetch('/x/login.cgi',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:u.value,password:b64(p.value),encoding:'base64'})
    });
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.success){location.replace('/');return;}
    err.textContent=(j.error&&j.error.message)||'Sign in failed';
  }catch(_){err.textContent='Cannot reach the camera';}
  b.disabled=false;b.textContent='Sign in';
});
</script>
</body>
</html>
